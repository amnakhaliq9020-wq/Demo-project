<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidShare Backend Tester</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 { color: #333; text-align: center; margin-bottom: 30px; }
        .section {
            margin-bottom: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #14b8a6;
        }
        .section h2 { color: #14b8a6; margin-bottom: 15px; font-size: 18px; }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        button {
            background: #14b8a6;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin-top: 10px;
        }
        button:hover { background: #0d9488; }
        .response {
            margin-top: 15px;
            padding: 15px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 12px;
            font-family: monospace;
        }
        .success { border-color: #10b981; background: #f0fdf4; }
        .error { border-color: #ef4444; background: #fef2f2; }
        .info { background: #dbeafe; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 VidShare Backend Tester</h1>
        
        <div class="info">
            <strong>Base URL:</strong> http://localhost:5000<br>
            <strong>Status:</strong> <span id="serverStatus">Checking...</span>
        </div>

        <!-- Register -->
        <div class="section">
            <h2>1. Register User</h2>
            <input type="text" id="regName" placeholder="Full Name" value="Test User">
            <input type="email" id="regEmail" placeholder="Email" value="test@example.com">
            <input type="text" id="regUser" placeholder="Username" value="testuser">
            <input type="password" id="regPass" placeholder="Password" value="test123">
            <button onclick="register()">Register</button>
            <div id="regRes" class="response" style="display:none;"></div>
        </div>

        <!-- Verify -->
        <div class="section">
            <h2>2. Verify Email</h2>
            <input type="text" id="verifyId" placeholder="User ID (from email)">
            <input type="text" id="verifyToken" placeholder="Token (from email)">
            <button onclick="verify()">Verify Email</button>
            <div id="verifyRes" class="response" style="display:none;"></div>
        </div>

        <!-- Login -->
        <div class="section">
            <h2>3. Login</h2>
            <input type="email" id="loginEmail" placeholder="Email" value="test@example.com">
            <input type="password" id="loginPass" placeholder="Password" value="test123">
            <button onclick="login()">Login</button>
            <div id="loginRes" class="response" style="display:none;"></div>
            <div id="tokenDiv" style="display:none; margin-top:10px; padding:10px; background:#1e293b; color:#10b981; border-radius:5px; font-size:11px; word-break:break-all;"></div>
        </div>

        <!-- Current User -->
        <div class="section">
            <h2>4. Get Current User</h2>
            <textarea id="userToken" placeholder="Access Token (auto-filled after login)" rows="3"></textarea>
            <button onclick="getUser()">Get User</button>
            <div id="userRes" class="response" style="display:none;"></div>
        </div>
    </div>

    <script>
        const API = 'http://localhost:5000';
        
        // Check server status
        fetch(`${API}/health`).then(r => r.json()).then(d => {
            document.getElementById('serverStatus').textContent = '✅ Connected';
            document.getElementById('serverStatus').style.color = '#10b981';
        }).catch(() => {
            document.getElementById('serverStatus').textContent = '❌ Not Connected - Start server: npm run dev';
            document.getElementById('serverStatus').style.color = '#ef4444';
        });

        function showRes(id, data, success) {
            const el = document.getElementById(id);
            el.style.display = 'block';
            el.className = 'response ' + (success ? 'success' : 'error');
            el.textContent = JSON.stringify(data, null, 2);
        }

        async function register() {
            const data = {
                fullname: document.getElementById('regName').value,
                email: document.getElementById('regEmail').value,
                username: document.getElementById('regUser').value,
                password: document.getElementById('regPass').value
            };
            try {
                const res = await fetch(`${API}/users/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                showRes('regRes', result, res.ok);
                if (res.ok && result.data) {
                    document.getElementById('verifyId').value = result.data.userId || '';
                }
            } catch (e) {
                showRes('regRes', { error: e.message }, false);
            }
        }

        async function verify() {
            const userId = document.getElementById('verifyId').value;
            const token = document.getElementById('verifyToken').value;
            if (!userId || !token) {
                alert('Enter User ID and Token');
                return;
            }
            try {
                const res = await fetch(`${API}/users/verify/${userId}/${token}`, { method: 'POST' });
                const result = await res.json();
                showRes('verifyRes', result, res.ok);
            } catch (e) {
                showRes('verifyRes', { error: e.message }, false);
            }
        }

        async function login() {
            const data = {
                email: document.getElementById('loginEmail').value,
                password: document.getElementById('loginPass').value
            };
            try {
                const res = await fetch(`${API}/users/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                showRes('loginRes', result, res.ok);
                if (res.ok && result.data && result.data.accessToken) {
                    document.getElementById('userToken').value = result.data.accessToken;
                    document.getElementById('tokenDiv').textContent = 'Token: ' + result.data.accessToken;
                    document.getElementById('tokenDiv').style.display = 'block';
                }
            } catch (e) {
                showRes('loginRes', { error: e.message }, false);
            }
        }

        async function getUser() {
            const token = document.getElementById('userToken').value;
            if (!token) {
                alert('Enter Access Token');
                return;
            }
            try {
                const res = await fetch(`${API}/users/current-user`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const result = await res.json();
                showRes('userRes', result, res.ok);
            } catch (e) {
                showRes('userRes', { error: e.message }, false);
            }
        }
    </script>
</body>
</html>
